spring:
  profiles:
    active: local
  application:
    name: jobportal

  datasource:
    url: jdbc:mysql://localhost:3306/jobportal?serverTimezone=Asia/Seoul
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  data:
    redis:
      host: localhost
      port: 6379

# NOTE: JwtProperties가 prefix="jwt"를 바라보도록(권장) 코드도 맞춰주세요.
jwt:
  access-expiration: 900        # 15m
  refresh-expiration: 604800    # 7d

cors:
  allowed-origins:
    - http://localhost:3000
